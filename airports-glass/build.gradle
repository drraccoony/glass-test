// Airports: METARs for the airports picked on the phone, one card each. A separate app
// that gets them through the GlassLink hub (channel dev.glassrevival.metar).
plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.glassrevival.airports'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.glassrevival.airports'
        minSdk 19
        //noinspection ExpiredTargetSdkVersion
        targetSdk 19
        // Glass's screen is hdpi. Android 4.4 can't draw vector drawables, so the build turns
        // them into PNGs: only for hdpi, which keeps the APK small enough to send over Bluetooth.
        vectorDrawables.generatedDensities = ['hdpi']
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        // Must match GlassLink's key: the hub only lets apps signed with it connect.
        dev {
            storeFile rootProject.file('keystore/glasslink-dev.jks')
            storePassword 'glasslink'
            keyAlias 'glasslink'
            keyPassword 'glasslink'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.dev }
        release {
            signingConfig signingConfigs.dev
            minifyEnabled false
        }
    }

    // Leave out the encrypted dependency list AGP adds for Google Play. It made a 100 KB app
    // about 270 KB, and add-ons cross Bluetooth to Glass at about 5 KB/s.
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
    }
}

dependencies {
    implementation project(':hub-api')
    compileOnly project(':gdk-stubs')
}
