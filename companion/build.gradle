plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.glassrevival.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.glassrevival.companion'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        dev {
            storeFile rootProject.file('keystore/glasslink-dev.jks')
            storePassword 'glasslink'
            keyAlias 'glasslink'
            keyPassword 'glasslink'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.dev }
        release {
            signingConfig signingConfigs.dev
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

// The Glass add-on apps ride along inside the companion, so its Apps tab can install them
// on Glass. Always the debug builds: they're signed with the same key either way.
def addOnApps = [
    'nav-glass'     : 'dev.glassrevival.nav',
    'recipes-glass' : 'dev.glassrevival.recipes',
    'airports-glass': 'dev.glassrevival.airports',
]
def addOnAssets = layout.buildDirectory.dir('generated/addon-assets')
def copyAddOns = tasks.register('copyAddOns', Copy) {
    addOnApps.each { module, pkg ->
        dependsOn ":${module}:assembleDebug"
        from(rootProject.file("${module}/build/outputs/apk/debug/${module}-debug.apk")) {
            rename { "${pkg}.apk" }
        }
    }
    into addOnAssets.map { it.dir('addons') }
}
android.sourceSets.main.assets.srcDir(addOnAssets)
tasks.named('preBuild') { dependsOn copyAddOns }

dependencies {
    implementation project(':protocol')
    implementation project(':hub-api')
}
